<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tapi Scheduled Provider Queries — API</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css" />
  <style>
    body { margin: 0; background: #fafafa; }
    .banner { background: #0f172a; color: #e2e8f0; padding: 14px 24px; font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .banner a { color: #93c5fd; }
    .banner strong { color: #ffffff; }
  </style>
</head>
<body>
  <div class="banner">
    <strong>Tapi — Consultas diarias programadas a proveedores.</strong>
    Este sistema no expone una API pública: acá se documenta el contrato que consume de la API interna, los health checks y la mock API de pruebas.
    · <a href="https://github.com/MartinMGomezVega/tapi-challenge">Repositorio</a>
    · <a href="https://github.com/MartinMGomezVega/tapi-challenge/blob/main/docs/architecture.md">Arquitectura y ADRs</a>
    · <a href="openapi.yaml">openapi.yaml</a>
  </div>
  <div id="swagger-ui"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js" crossorigin></script>
  <script>
    window.addEventListener("load", function () {
      window.ui = SwaggerUIBundle({
        url: "openapi.yaml",
        dom_id: "#swagger-ui",
        deepLinking: true,
        docExpansion: "list",
        defaultModelsExpandDepth: 1,
        // Documentación de referencia: los endpoints son privados o locales, así que se desactiva "Try it out".
        supportedSubmitMethods: [],
        validatorUrl: null
      });
    });
  </script>
</body>
</html>
