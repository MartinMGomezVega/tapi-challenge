<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 960" font-family="Inter, Helvetica, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b45309"/>
    </marker>
    <style>
      .t{font-size:17px;font-weight:700;fill:#0f172a}
      .d{font-size:13.5px;fill:#334155}
      .l{font-size:12.5px;fill:#334155}
      .lr{font-size:12.5px;fill:#b45309}
      .sec{font-size:14px;font-weight:600;fill:#475569}
      .ln{stroke:#334155;stroke-width:1.6;fill:none}
      .lnr{stroke:#b45309;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .bg{fill:#ffffff}
    </style>
  </defs>
  <rect width="1600" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="42" font-size="24" font-weight="700" fill="#0f172a">Tapi — Consultas diarias programadas a proveedores · AWS (1 cuenta, 1 región)</text>
  <text x="40" y="70" font-size="15" fill="#475569">Invariantes: ≤ 1 llamada en vuelo por proveedor · 1 ejecución por registro y día (clave request_id#run_date) · carga uniforme en 1.440 slots (1 por minuto)</text>

  <!-- Left: data -->
  <text x="40" y="112" class="sec">Datos — DynamoDB (vía VPC endpoint)</text>

  <rect x="40" y="128" width="330" height="112" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="156" class="t">DynamoDB · coordination</text>
  <text x="58" y="180" class="d">Lease de líder + fencing token</text>
  <text x="58" y="200" class="d">Watermark (run_date, último slot)</text>
  <text x="58" y="220" class="d">Registro de proveedores + histograma</text>

  <rect x="40" y="268" width="330" height="122" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="296" class="t">DynamoDB · requests (catálogo)</text>
  <text x="58" y="320" class="d">id, provider, endpoint, body, slot, shard</text>
  <text x="58" y="340" class="d">GSI slot#shard → despacho por minuto</text>
  <text x="58" y="360" class="d">GSI provider → backfill en streaming</text>
  <text x="58" y="380" class="d">Cero Scan · on-demand · PITR · KMS</text>

  <rect x="40" y="418" width="330" height="132" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="58" y="446" class="t">DynamoDB · executions</text>
  <text x="58" y="470" class="d">PK request_id · SK run_date</text>
  <text x="58" y="490" class="d">PENDING → ENQUEUED → IN_PROGRESS →</text>
  <text x="58" y="510" class="d">SUCCEEDED | FAILED_* | SKIPPED</text>
  <text x="58" y="530" class="d">Escrituras condicionales · lease · TTL 90 d</text>

  <!-- VPC -->
  <rect x="470" y="96" width="440" height="664" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="490" y="122" class="sec">VPC privada · 3 AZ · sin NAT · ECS Fargate ARM64</text>

  <rect x="515" y="140" width="350" height="160" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="533" y="168" class="t">dispatcher-svc (2 réplicas, 1 líder)</text>
  <text x="533" y="192" class="d">Ticker cada 1 min + catch-up por watermark</text>
  <text x="533" y="212" class="d">Consulta el slot del minuto (shards en paralelo)</text>
  <text x="533" y="232" class="d">Crea PENDING condicional → encola</text>
  <text x="533" y="252" class="d">Re-envía PENDING huérfanos (&gt; 5 min)</text>
  <text x="533" y="272" class="d">Fencing: un ex-líder no avanza el watermark</text>

  <rect x="515" y="340" width="350" height="200" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
  <text x="533" y="368" class="t">worker-svc (autoscaling por backlog)</text>
  <text x="533" y="392" class="d">N tasks × k goroutines (semáforo)</text>
  <text x="533" y="412" class="d">Batch agrupado por proveedor → en serie</text>
  <text x="533" y="432" class="d">Heartbeat de visibilidad de todo el grupo</text>
  <text x="533" y="452" class="d">Clasifica error → reintento / fallo final</text>
  <text x="533" y="472" class="d">Backoff exponencial + jitter · breaker</text>
  <text x="533" y="492" class="d">Presupuesto: k × tasks ≤ cuota Lambda / 2</text>
  <text x="533" y="512" class="d">SIGTERM: termina en vuelo, libera el resto</text>

  <rect x="515" y="580" width="350" height="150" rx="10" fill="#f0f9ff" stroke="#0284c7" stroke-width="2"/>
  <text x="533" y="608" class="t">reconciler-job (diario, 00:30)</text>
  <text x="533" y="632" class="d">Recorre requests por slot (sin Scan)</text>
  <text x="533" y="652" class="d">BatchGet de executions del día anterior</text>
  <text x="533" y="672" class="d">Re-despacha faltantes / atascados</text>
  <text x="533" y="692" class="d">Cobertura diaria + capacidad por proveedor</text>
  <text x="533" y="712" class="d">Publica reporte y métricas</text>

  <!-- Scheduler -->
  <rect x="545" y="820" width="290" height="70" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="563" y="848" class="t">EventBridge Scheduler</text>
  <text x="563" y="872" class="d">cron diario → ECS RunTask</text>

  <!-- Right: messaging -->
  <text x="1000" y="112" class="sec">Mensajería</text>
  <rect x="1000" y="128" width="320" height="132" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="2"/>
  <text x="1018" y="156" class="t">SQS FIFO · tapi-jobs.fifo</text>
  <text x="1018" y="180" class="d">MessageGroupId = provider</text>
  <text x="1018" y="200" class="d">→ nunca 2 mensajes de un proveedor</text>
  <text x="1018" y="220" class="d">    en vuelo a la vez</text>
  <text x="1018" y="240" class="d">DedupId = request_id#run_date</text>

  <rect x="1000" y="290" width="320" height="92" rx="10" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="1018" y="318" class="t">SQS FIFO · DLQ</text>
  <text x="1018" y="342" class="d">Reintentos agotados → FAILED_EXHAUSTED</text>
  <text x="1018" y="362" class="d">Alarma &gt; 0 · cmd/redrive</text>

  <!-- Internal API -->
  <rect x="1360" y="400" width="210" height="236" rx="12" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="1376" y="426" class="t">API interna</text>
  <text x="1376" y="446" class="l">misma cuenta y región</text>
  <rect x="1378" y="460" width="174" height="40" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1390" y="485" class="d">API Gateway privado</text>
  <rect x="1378" y="522" width="174" height="34" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1390" y="544" class="d">Lambda A</text>
  <rect x="1378" y="578" width="174" height="34" rx="6" fill="#ffffff" stroke="#7c3aed"/>
  <text x="1390" y="600" class="d">Lambda B</text>
  <path class="ln" d="M1465,500 L1465,522" marker-end="url(#a)"/>
  <path class="ln" d="M1465,556 L1465,578" marker-end="url(#a)"/>
  <text x="1360" y="660" class="l">2 lambdas por consulta: comparten</text>
  <text x="1360" y="678" class="l">la cuota de concurrencia de la cuenta</text>

  <rect x="1000" y="540" width="320" height="112" rx="10" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="1018" y="568" class="t">S3 · tapi-results</text>
  <text x="1018" y="592" class="d">results/ — respuestas &gt; 350 KB</text>
  <text x="1018" y="612" class="d">reports/ — reporte diario JSON/CSV</text>
  <text x="1018" y="632" class="d">Consultable con Athena · KMS · TLS</text>

  <!-- Observability -->
  <rect x="1000" y="700" width="320" height="120" rx="10" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="1018" y="728" class="t">CloudWatch · X-Ray</text>
  <text x="1018" y="752" class="d">Logs JSON sin PII · métricas EMF</text>
  <text x="1018" y="772" class="d">Trazas por request (traceparent)</text>
  <text x="1018" y="792" class="d">7 alarmas + SNS + runbooks</text>
  <text x="1018" y="812" class="l">(reciben de los 3 servicios)</text>

  <!-- Dispatcher arrows -->
  <path class="ln" d="M515,184 L372,184" marker-end="url(#a)"/>
  <rect x="388" y="163" width="125" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="392" y="176" class="l">lease + watermark</text>
  <path class="ln" d="M515,226 L372,318" marker-end="url(#a)"/>
  <rect x="394" y="249" width="77" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="398" y="262" class="l">Query slot</text>
  <path class="ln" d="M515,272 L372,446" marker-end="url(#a)"/>
  <path class="ln" d="M865,192 L998,192" marker-end="url(#a)"/>
  <rect x="868" y="169" width="118" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="872" y="182" class="l">SendMessageBatch</text>
  <!-- Queue arrows -->
  <path class="ln" d="M1040,262 L867,392" marker-end="url(#a)"/>
  <rect x="868" y="317" width="56" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="872" y="330" class="l">Receive</text>
  <path class="ln" d="M1160,262 L1160,288" marker-end="url(#a)"/>
  <rect x="1166" y="267" width="139" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="1170" y="280" class="l">maxReceiveCount = 6</text>
  <!-- Worker arrows -->
  <path class="ln" d="M515,372 L372,372" marker-end="url(#a)"/>
  <rect x="448" y="353" width="56" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="452" y="366" class="l">GetItem</text>
  <path class="ln" d="M515,480 L372,490" marker-end="url(#a)"/>
  <path class="ln" d="M865,470 L1358,470" marker-end="url(#a)"/>
  <rect x="1006" y="447" width="221" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="1010" y="460" class="l">HTTPS + SigV4 · Idempotency-Key</text>
  <rect x="1006" y="479" width="284" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="1010" y="492" class="l">(VPC endpoint execute-api, timeout 25 s)</text>
  <path class="ln" d="M865,520 L998,580" marker-end="url(#a)"/>
  <rect x="868" y="535" width="62" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="872" y="548" class="l">&gt; 350 KB</text>
  <!-- Reconciler arrows -->
  <path class="ln" d="M515,640 L372,545" marker-end="url(#a)"/>
  <rect x="432" y="605" width="63" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="436" y="618" class="l">BatchGet</text>
  <path class="ln" d="M865,640 L998,615" marker-end="url(#a)"/>
  <rect x="868" y="655" width="56" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="872" y="668" class="l">reporte</text>
  <path class="lnr" d="M865,700 L960,700 L960,250 L998,250" marker-end="url(#ar)"/>
  <rect x="964" y="637" width="83" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="968" y="650" class="lr">re-despacho</text>
  <rect x="964" y="653" width="83" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="968" y="666" class="lr">idempotente</text>
  <path class="ln" d="M690,818 L690,732" marker-end="url(#a)"/>
  <rect x="374" y="395" width="111" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="378" y="408" class="l">PutItem PENDING</text>
  <rect x="374" y="463" width="132" height="18" fill="#ffffff" opacity="0.92"/>
  <text x="378" y="476" class="l">Acquire / Complete</text>

  <!-- Legend -->
  <line x1="40" y1="920" x2="80" y2="920" class="ln"/>
  <text x="90" y="924" class="l">flujo principal</text>
  <line x1="210" y1="920" x2="250" y2="920" class="lnr"/>
  <text x="260" y="924" class="lr">recuperación (reconciliación)</text>
  <text x="1000" y="924" class="l">Detalle de cada decisión: docs/architecture.md (ADR-001 a ADR-007)</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
