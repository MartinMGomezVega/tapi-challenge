services:
  localstack:
    image: localstack/localstack:4.0.3
    container_name: tapi-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=dynamodb,sqs,s3
      - DEFAULT_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - PERSISTENCE=0
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4566/_localstack/health"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  init:
    image: amazon/aws-cli:2.22.0
    container_name: tapi-init
    depends_on:
      localstack:
        condition: service_healthy
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
    volumes:
      - ./scripts/localstack-init.sh:/scripts/localstack-init.sh:ro
    entrypoint: ["/bin/sh", "/scripts/localstack-init.sh"]

  mockapi:
    build:
      context: .
      dockerfile: build/mockapi.Dockerfile
    container_name: tapi-mockapi
    profiles: ["services"]
    ports:
      - "8090:8090"
    environment:
      - ADDR=:8090
      - DEFAULT_LATENCY_MS=2

  dispatcher:
    build:
      context: .
      dockerfile: build/dispatcher.Dockerfile
    container_name: tapi-dispatcher
    profiles: ["services"]
    depends_on:
      localstack:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - JOBS_QUEUE_NAME=tapi-jobs.fifo
      - SHARDS=4
      - CLOCK_SPEEDUP=${CLOCK_SPEEDUP:-720}

  worker:
    build:
      context: .
      dockerfile: build/worker.Dockerfile
    container_name: tapi-worker
    profiles: ["services"]
    depends_on:
      localstack:
        condition: service_healthy
      mockapi:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ENDPOINT_URL=http://localstack:4566
      - JOBS_QUEUE_NAME=tapi-jobs.fifo
      - PROVIDER_API_BASE_URL=http://mockapi:8090
      - INFLIGHT_PER_TASK=32
      - MAX_TASKS=4
      - LAMBDA_BUDGET=1000
      - RECEIVERS=2
